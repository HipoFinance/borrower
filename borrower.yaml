# Friendly address of hTON treasury.
treasury: EQCLyZHP4Xe8fpchQz76O-_RmUhaVc_9BAoGyJrwJrcbz2eZ

# The path to the ton global config.
global_config: /usr/bin/ton/global.config.json

# Configure borrowing.
borrow:
    # Whether the borrowing functionality is active or not.
    active: yes # yes | no

    # Additional amount to stake alongside the borrowed loan.
    stake: "0" # TON amount

    # The minimum loan amount. When zero, network config of min_stake will be used.
    loan: "0" # TON amount

    # The minimum payment to pay for the loan, when it is accepted.
    min_payment: "0" # TON amount

    # Caps your effective stake at this multiple of the smallest stake among the elected validators,
    # which is how you bound your share of block production. Anything above the cap is returned by
    # the elector at once and earns nothing for the round.
    #
    # When zero, the network config of max_stake_factor is used, which is what you want unless you
    # are deliberately limiting how much validation your node takes on. A value above the network
    # maximum is clamped down to it.
    max_factor_ratio: 0 # 0 | >= 1.0

    # The ratio to divide the reward of validation between treasury and you.
    # It will be divided by 65535, so for example 26214 means 40%.
    #
    # This replaces validator_reward_share, which was out of 255. Multiply an old value by 257:
    # 8 becomes 2056, 102 becomes 26214. The borrower refuses to start on the old key rather than
    # reading the old number on the new scale, which would give away almost your whole share.
    #
    # IGNORED once the treasury sets the share itself. The share stopped being part of a bid: the
    # treasury publishes one value that every loan carries, and a request that still names its own
    # is refused. This borrower reads which kind of treasury it is talking to and builds the request
    # to match, so the key can stay here -- it is simply no longer used, and the log says so once
    # per round when it differs from the protocol's value.
    reward_share: 26214 # 0-65535

# Configure the wallet used to pay for loan requests.
wallet:
    # The type of the secret file.
    # Use mnemonic when the file has the 24-word seed.
    # Use binary when the file has the secret key in binary form.
    type: mnemonic # mnemonic | binary

    # The path to the secret file of the wallet.
    path: wallet.secret

    # The version of wallet smart-contract.
    version: v5r1final # v5r1final | v4r2 | v3r2

# Configure your validator engine here.
validator_engine:
    # The path to the validator-engine-console executable.
    executable: /usr/bin/ton/validator-engine-console/validator-engine-console

    # The path to the client secret key.
    client_key: /var/ton-work/keys/client

    # The path to the server public key.
    server_key: /var/ton-work/keys/server.pub

    # The IP address of the validator engine.
    ip: "127.0.0.1"

    # The port for control interface.
    control_port: 6269

    # Find the hex encoded ADNL address of your validator in `mytonctrl` using the `status` command.
    adnl_address:
